            font-size: 14px; padding: 0 14px;
        }
        .dropdown {
            position: absolute; top: var(--header-height); left: 0; width: 420px;

            border: 1px solid #eeeeee; border-radius: var(--menu-radius);
            box-shadow: var(--menu-shadow);

            transition: opacity 0.25s, visibility 0.25s, transform 0.25s;
            overflow: hidden; cursor: default;
        }
        .nav-menu:hover .dropdown {
            opacity: 1; visibility: visible; transform: translateY(0);
        }
        .nav-menu.is-open .dropdown {
            opacity: 1; visibility: visible; transform: translateY(0);
        }
        .dropdown-header {
            padding: 14px 20px; background: #f5f5f6;
            color: #C8102E; font-size: 14px; font-weight: 700;
            border-bottom: 1px solid #eeeeee;
        }
        .dropdown-content {
            padding: 0 20px; max-height: calc(100vh - var(--header-height) - 66px);
            overflow-y: auto; overscroll-behavior: contain;
            scrollbar-width: thin;
        }
        .dropdown-group { padding: 14px 0; }
        .dropdown-group + .dropdown-group { border-top: 1px solid #eeeeee; }
        .dropdown-group-title {
            display: flex; align-items: center; gap: 9px;
            color: #C8102E; font-size: 14px; font-weight: 700; line-height: 20px;
        }
        .dropdown-group-title::before {
            content: ''; display: block; width: 4px; height: 16px;
            flex-shrink: 0; border-radius: 2px; background: #C8102E;
        }
        .dropdown-places { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .dropdown-item {
            padding: 7px 12px; border: none; border-radius: 4px;
            background: #f3f4f5; color: #444; font: inherit;
            font-size: 13px; line-height: 18px; white-space: nowrap; cursor: pointer;
            transition: background-color 0.18s, color 0.18s;
        }
        .dropdown-item:not(:disabled):hover,
        .dropdown-item:not(:disabled):focus-visible {
            background: #C8102E; color: #ffffff;
        }
        .dropdown-item:disabled { color: #999; cursor: not-allowed; }
        .dropdown-pending { margin-left: 4px; font-size: 11px; }
        #search-area {
            position: relative; margin-left: 24px; width: 240px;

        }
        #search-box {
            width: 100%; height: 30px; min-width: 0;
            border: none; padding: 0 14px; font-size: 14px;
        }
        #search-history {

            background: #ffffff; color: #333; z-index: 200;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        .history-item {
            display: block; width: 100%; padding: 12px 14px;
            border: none; background: #ffffff; color: #333;
            font: inherit; font-size: 14px; text-align: left;
            overflow-wrap: anywhere; cursor: pointer;
        }
        .history-item:hover { color: #C8102E; }
        #mode-switch { margin-left: auto; display: flex; flex-shrink: 0; }
        .mode-btn {

            color: #fff; cursor: pointer; font-size: 14px;

        .mode-btn.active { background: #fff; color: var(--lyun-red); }
        #panorama-container {
            position: fixed; top: var(--header-height); left: 0; width: 100vw; height: calc(100vh - var(--header-height));

        }
        .info-card {

        .info-card h3 {

        .info-category {
